<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ruang Aman · Pojok Baca: Materi Psikoedukasi untuk Remaja Indonesia. Anonim, Gratis, dan Menenangkan.">
    <title>Ruang Aman · Pojok Baca DKM</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- JavaScript Script -->
    <script src="js/script.js" defer></script>
</head>
<body>

    <!-- Ambient Floating Bubbles Background -->
    <div class="ambient-bg" aria-hidden="true">
        <div class="bubble-decor bubble-1"></div>
        <div class="bubble-decor bubble-2"></div>
        <div class="bubble-decor bubble-3"></div>
    </div>

    <div class="app-container">
        
        <!-- Emergency Banner -->
        <div class="emergency-banner" role="alert">
            <span>⚠️ Butuh teman bicara cepat? Hubungi hotline gratis:</span>
            <a href="tel:119">119 ext 8 (24 Jam)</a>
        </div>

        <!-- Main Glassmorphism Card Container -->
        <main class="glass-bubble-card">
            
            <!-- Profile / Brand Header Section with DKM Logo -->
            <header class="profile-header">
                <div class="avatar-badge">
                    <img src="1000255469.png.jpg" alt="Logo Duta Kesehatan Mental (DKM)" class="logo-img">
                </div>
                <h1>POJOK BACA DKM</h1>
                <p class="subtitle">Ruang Aman · Materi Psikoedukasi Duta Kesehatan Mental</p>
            </header>

            <!-- Navigation / Category Filters -->
            <nav class="filter-nav" aria-label="Kategori Artikel">
                <button class="pill-btn active" data-category="all">✨ Semua</button>
                <button class="pill-btn" data-category="Stres & Tekanan">🧠 Stres</button>
                <button class="pill-btn" data-category="Kecemasan">🌧️ Kecemasan</button>
                <button class="pill-btn" data-category="Relasi & Sosial">🤝 Relasi</button>
                <button class="pill-btn" data-category="Diri & Harga Diri">🌱 Self-Love</button>
            </nav>

            <!-- Article Items Grid Container -->
            <section class="article-grid" id="articleList">
                <!-- Injected dynamically via JS -->
            </section>

        </main>

        <!-- Footer -->
        <footer>
            <p>Duta Kesehatan Mental (DKM) · Non-profit Digital Public Good · 2026</p>
            <p style="margin-top: 4px;">Tanpa Akun. Anonim. Gratis.</p>
        </footer>

    </div>

    <!-- Reading Modal Overlay -->
    <div class="modal-overlay" id="readerModal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-bubble-content">
            <button class="close-btn" id="closeModalBtn" aria-label="Tutup Artikel">&times;</button>
            <div class="modal-body" id="modalBody">
                <!-- Dynamic Article Details via JS -->
            </div>
        </div>
    </div>

</body>
</html>
